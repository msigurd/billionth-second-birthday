<!DOCTYPE html>
<html lang='en-US'>
  <head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='apple-touch-icon' href='apple-touch-icon.png' />
    <link rel='icon' href='favicon.svg' type='image/svg+xml' />
    <link rel='icon' href='favicon.ico' sizes='32x32' />
    <title>Billionth Second Birthday</title>
    <script type='text/javascript' src='script.js'></script>
    <link rel='stylesheet' href='style.css'>
    <meta name='description' content='Find out what date you turn a billion seconds.'>
  </head>
  <body>
    <main>
      <noscript>You need to enable JavaScript to calculate your billionth second birthday.</noscript>
      <form>
        <div id='birthdate-input-container'>
          <label for='birthdate-input'>Your birthdate:</label>
          <input id='birthdate-input' name='birthdate' type='date' />
        </div>
        <div id='bsb-output-container' class='hidden'>
          <label for='bsb-output'>You turn a billion seconds on:</label>
          <output id='bsb-output'>January 1, 1970</output>
        </div>
      </form>
    </main>
    <footer>
      <a href='https://github.com/msigurd/billionth-second-birthday' target='_blank' rel='noopener noreferrer'>
        Source code
      </a>
    </footer>
  </body>
</html>
